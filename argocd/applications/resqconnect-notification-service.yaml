apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resqconnect-notification-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: resqconnect
  source:
    repoURL: https://github.com/DKS2301/retail-store-sample-app
    targetRevision: gitops
    path: src/notification-service/chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: resqconnect
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 
