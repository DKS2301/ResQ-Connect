# Default values for ingest-service
replicaCount: 2

image:
  repository: 739275464689.dkr.ecr.us-west-2.amazonaws.com/resqconnect-ingest-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8085

resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}

# Environment variables
env:
  - name: REDIS_HOST
    value: "redis-service"
  - name: REDIS_PORT
    value: "6379"
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: "kafka-service:9092"

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: 8085
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8085
  initialDelaySeconds: 5
  periodSeconds: 5

# Metrics
metrics:
  enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8085"
    prometheus.io/path: "/metrics"

# Redis dependency (for development)
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  service:
    name: redis-service
    port: 6379