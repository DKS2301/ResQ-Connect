{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: coordinator-ui
spec:
  hosts:
  - "*"
  gateways:
  - resqconnect-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: coordinator-ui
        port:
          number: 80
{{- end }}