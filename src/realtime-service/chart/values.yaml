# Default values for realtime-service
replicaCount: 3

image:
  repository: 739275464689.dkr.ecr.us-west-2.amazonaws.com/resqconnect-realtime-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8088

resources:
  limits:
    memory: 512Mi
    cpu: 300m
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}

# Environment variables
env:
  - name: REDIS_HOST
    value: "redis-service"
  - name: REDIS_PORT
    value: "6379"
  - name: CORS_ORIGIN
    value: "*"
  - name: NODE_ENV
    value: "production"

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: 8088
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8088
  initialDelaySeconds: 10
  periodSeconds: 5

# Metrics
metrics:
  enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8088"
    prometheus.io/path: "/metrics"

# ResQConnect additions (non-invasive defaults)
eventBus:
  provider: kafka
  brokers: []
  topics:
    matchProposed: "match.proposed"
    volunteerStatusChanged: "volunteer.status_changed"

otel:
  exporterOtlpEndpoint: ""
  resourceAttributes:
    serviceName: "realtime-service"

security:
  jwt:
    issuer: ""
    audience: ""
  mtls:
    enabled: false